      h1 em { color: #c66b43; font-family: Georgia, serif; font-weight: 400; }
      a { display: inline-block; margin-top: 1rem; color: #fbfaf7; background: #1e2421; padding: .85rem 1.1rem; text-decoration: none; font-weight: 700; }
      a:hover { background: #c66b43; }

  <body>
    <main>
      <p class="eyebrow">Cream City Web Co.</p>
